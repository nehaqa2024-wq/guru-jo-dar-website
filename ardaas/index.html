<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ardaas - Guru Jo Dar</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="ardaas" class="inner-page">
    <audio id="ambient-audio" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"></audio>
    <div id="site-header"></div>
    <div id="site-drawer"></div>
    <main class="page-main">
<section id="ardaas" class="section-padding">
            <div class="container">
                <div class="section-header text-center">
                    <h2 data-en="Submit Ardaas (Prayer Request)" data-hi="अरदास अनुरोध सबमिट करें" data-sd="अरदास पाठियो">Submit Ardaas (Prayer Request)</h2>
                    <div class="divider"></div>
                    <p class="section-subtitle" data-en="Send your prayers to be offered at the feet of Baba Mulram Saheb during the weekly Sunday Satsang." data-hi="साप्ताहिक रविवार सत्संग के दौरान बाबा मूलराम साहिब के चरणों में प्रार्थना के लिए अपनी अरदास भेजें।" data-sd="रविवार जे सत्संग में बाबा मूलराम साहिब जे चरनन में अर्ज़ करण लाय पंहिंजी अरदास लिखो।">Send your prayers to be offered at the feet of Baba Mulram Saheb during the weekly Sunday Satsang.</p>
                </div>

                <div class="ardaas-card">
                    <form id="ardaas-form" onsubmit="handleArdaasSubmit(event)">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="ardaas-name" data-en="Full Name" data-hi="पूरा नाम" data-sd="नालो">Full Name *</label>
                                <input type="text" id="ardaas-name" required placeholder="Enter your name">
                            </div>
                            <div class="form-group">
                                <label for="ardaas-email" data-en="Email Address" data-hi="ईमेल आईडी" data-sd="ईमेल">Email Address *</label>
                                <input type="email" id="ardaas-email" required placeholder="yourname@domain.com">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="ardaas-phone" data-en="Mobile Number (Optional)" data-hi="मोबाइल नंबर (वैकल्पिक)" data-sd="फ़ोन नंबर">Mobile Number (Optional)</label>
                            <input type="tel" id="ardaas-phone" placeholder="Enter mobile number">
                        </div>
                        <div class="form-group">
                            <label for="ardaas-message" data-en="Your Prayer / Intention" data-hi="आपकी प्रार्थना / संकल्प" data-sd="अरदास">Your Prayer / Intention *</label>
                            <textarea id="ardaas-message" rows="5" required placeholder="Write your prayers here..."></textarea>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-wide">
                                <span data-en="Submit to Darbar" data-hi="दरबार में सबमिट करें" data-sd="दरबार में पाठियो">Submit to Darbar</span>
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </div>
                    </form>

                    <!-- Ripple Effect Overlay for Success -->
                    <div class="success-overlay" id="success-overlay">
                        <div class="ripple-ring ring-1"></div>
                        <div class="ripple-ring ring-2"></div>
                        <div class="success-card">
                            <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
                            <h3 data-en="Ardaas Registered" data-hi="अरदास पंजीकृत" data-sd="अरदास स्वीकार">Ardaas Registered</h3>
                            <p data-en="May Baba Mulram Saheb bless you. Your prayer request has been submitted and will be read during the next congregation." data-hi="बाबा मूलराम साहिब आपको आशीर्वाद दें। आपकी प्रार्थना प्राप्त हो गई है और अगले सत्संग में पढ़ी जाएगी।" data-sd="बाबा मूलराम साहिब संदी मेहर करे। तव्हां जी अरदास स्वीकार थी आहे ऐं सत्संग में पढ़ी वेन्दी।">May Baba Mulram Saheb bless you. Your prayer request has been submitted and will be read during the next congregation.</p>
                            <button class="btn btn-secondary btn-sm" onclick="closeSuccessCard()" data-en="Done" data-hi="ठीक है" data-sd="ठीक आहे">Done</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <div id="site-footer"></div>
    <script src="../site-layout.js" data-base="../"></script>
    <script src="../app.js"></script>
</body>
</html>
